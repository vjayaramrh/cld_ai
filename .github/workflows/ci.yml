---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAMESPACE: openshift_lab
  COLLECTION_NAME: assisted_installer

jobs:
  sanity:
    name: Sanity (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pair each ansible-core with a supported controller Python.
        # Keep in sync with meta/runtime.yml and tests/sanity/ignore-*.txt.
        include:
          - ansible: stable-2.17
            python: '3.12'
          - ansible: stable-2.18
            python: '3.12'
          - ansible: stable-2.19
            python: '3.12'
    steps:
      - name: Checkout into collection path
        uses: actions/checkout@v4
        with:
          path: ansible_collections/${{ env.NAMESPACE }}/${{ env.COLLECTION_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: >-
          pip install
          "https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz"
          --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity --docker --color --coverage
        working-directory: ./ansible_collections/${{ env.NAMESPACE }}/${{ env.COLLECTION_NAME }}

  units:
    name: Units (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: stable-2.17
            python: '3.12'
          - ansible: stable-2.18
            python: '3.12'
          - ansible: stable-2.19
            python: '3.12'
    steps:
      - name: Checkout into collection path
        uses: actions/checkout@v4
        with:
          path: ansible_collections/${{ env.NAMESPACE }}/${{ env.COLLECTION_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: >-
          pip install
          "https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz"
          --disable-pip-version-check

      - name: Run unit tests
        run: ansible-test units --docker --color --coverage
        working-directory: ./ansible_collections/${{ env.NAMESPACE }}/${{ env.COLLECTION_NAME }}
