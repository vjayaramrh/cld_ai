---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: >-
          pip install --disable-pip-version-check
          "yamllint==1.37.1"
          "ansible-lint==25.6.1"

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
